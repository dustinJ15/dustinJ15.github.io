<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_newlines }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <a class="wordmark" href="{{ '/' | relative_url }}">Dustin Jones</a>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/process/' | relative_url }}"{% if page.url contains "process" %} aria-current="page"{% endif %}>Process</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains "about" %} aria-current="page"{% endif %}>About</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer>
    <p class="contact">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
      <a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a> ·
      <a href="{{ site.linkedin_url }}">LinkedIn</a>
    </p>
    <p class="colophon">Set in Fraunces and Charter. Built with Jekyll, hand-written CSS, no framework.</p>
  </footer>
</body>
</html>
