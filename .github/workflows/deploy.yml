# Build and deploy the Astro site to GitHub Pages.
#
# DELIBERATELY manual-only for now. The Jekyll site is still the source of truth
# for the live pages, and a push-triggered run would replace it the first time
# anything lands on main. Ticket 11 (delete Jekyll) is what adds:
#
#   push:
#     branches: [main]
#
# Nothing here runs until someone explicitly starts it from the Actions tab.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
