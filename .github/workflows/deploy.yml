# Build and deploy the Astro site to GitHub Pages.
#
# Runs on every push to main, and can also be started by hand from the Actions tab.
#
# Pages has to be switched to the GitHub Actions source before the first run, or
# configure-pages fails with "Get Pages site failed". Enabling it is deliberately
# not automated here (no `enablement: true`): it is one of the steps that needs
# Dustin's explicit approval, so it stays a hand action in the repo settings.
#
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
